const KEY='cashflow-v1';const defaults={opening:0,tx:[],lists:{payments:['מזומן','כרטיס אשראי','העברה בנקאית','צ׳ק','הוראת קבע','ביט'],expenses:['ספקים','דלק','חשמל','מים','משכנתא','ביטוחים','קניות','רכב','אחר'],incomes:['משכורת','פנסיה','עסק','נסיעות','ריבית','אחר'],cards:[],accounts:['פרטי','עסקי','מזומן'],suppliers:[],customers:[],banks:['לאומי','הפועלים','דיסקונט','מזרחי טפחות','הבינלאומי','אחר']},bankMeta:{},cardMeta:{}};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)};state.lists.banks ||= ['לאומי','הפועלים','דיסקונט','מזרחי טפחות','הבינלאומי','אחר'];state.bankMeta ||= {};state.cardMeta ||= {};const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:2})+' ₪',iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=iso(new Date());$('date').value=today;$('reportStart').value=today;let savedToastTimer;function showSavedToast(){const el=$('savedToast');if(!el)return;el.classList.add('visible');clearTimeout(savedToastTimer);savedToastTimer=setTimeout(()=>el.classList.remove('visible'),1400)}function persist(){localStorage.setItem(KEY,JSON.stringify(state));render();showSavedToast();cloudSave()}function tab(id,btn){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render()}function options(id,arr,blank=false){if(['account','destination','editAccount'].includes(id))arr=['פרטי'];let old=$(id).value;$(id).replaceChildren();if(blank){let o=new Option('ללא', '');$(id).add(o)}arr.forEach(x=>$(id).add(new Option(x,x)));if(arr.includes(old))$(id).value=old}function saveOpening(v){state.opening=Number(v)||0;persist()}function renderSuppliers(){const el=$('supplierItems');el.replaceChildren();const arr=state.lists.suppliers||[];if(
